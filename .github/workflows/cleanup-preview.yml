name: Clean site previews

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Exact branch name whose preview should be removed
        required: true
        type: string
      target:
        description: Helios target ID (empty means all); Pages preview is always removed
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: site-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && github.event.ref != 'site-builds')
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/site-operation.yml
    with:
      operation: cleanup-preview
      name: ${{ github.event_name == 'delete' && github.event.ref || inputs.branch }}
      target: ${{ inputs.target || '' }}
    secrets: inherit
