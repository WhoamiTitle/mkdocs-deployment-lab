name: Publish

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.22"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked

      - name: Run quality gates and strict build
        run: make check

  build-pages:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Build GitHub Pages artifact
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: >-
          .venv/bin/python -m publication_pipeline build --site-dir site
          | tee "$RUNNER_TEMP/pages-build.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

      - name: Upload Pages measurement receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-measurement-${{ github.run_id }}
          path: ${{ runner.temp }}/pages-build.json
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  deploy-helios-production:
    if: github.ref == 'refs/heads/main' && vars.HELIOS_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: helios-production
    concurrency:
      group: helios-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Prepare protected SSH files
        env:
          HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          HELIOS_KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .secrets
          install -m 600 /dev/null .secrets/helios_key
          install -m 600 /dev/null .secrets/known_hosts
          printf '%s\n' "$HELIOS_SSH_KEY" > .secrets/helios_key
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > .secrets/known_hosts

      - name: Build for Helios production URL
        env:
          SITE_URL: ${{ vars.HELIOS_BASE_URL }}
        run: >-
          .venv/bin/python -m publication_pipeline build --site-dir site
          | tee "$RUNNER_TEMP/helios-build.json"

      - name: Deploy production release
        id: deploy
        env:
          HELIOS_HOST: ${{ vars.HELIOS_HOST }}
          HELIOS_USER: ${{ vars.HELIOS_USER }}
          HELIOS_PORT: ${{ vars.HELIOS_PORT }}
          HELIOS_DEPLOYMENT_ROOT: ${{ vars.HELIOS_DEPLOYMENT_ROOT }}
          HELIOS_PUBLIC_PATH: ${{ vars.HELIOS_PUBLIC_PATH }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          .venv/bin/python -m publication_pipeline deploy-ssh --site-dir site
          | tee "$RUNNER_TEMP/helios-deploy.json"

      - name: Verify production release
        env:
          HELIOS_BASE_URL: ${{ vars.HELIOS_BASE_URL }}
        run: >-
          .venv/bin/python -m publication_pipeline healthcheck
          --url "$HELIOS_BASE_URL"
          --release-file site/release.json
          --attempts 5
          --delay-seconds 5
          | tee "$RUNNER_TEMP/helios-healthcheck.json"

      - name: Roll back after a failed production healthcheck
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          HELIOS_HOST: ${{ vars.HELIOS_HOST }}
          HELIOS_USER: ${{ vars.HELIOS_USER }}
          HELIOS_PORT: ${{ vars.HELIOS_PORT }}
          HELIOS_DEPLOYMENT_ROOT: ${{ vars.HELIOS_DEPLOYMENT_ROOT }}
          HELIOS_PUBLIC_PATH: ${{ vars.HELIOS_PUBLIC_PATH }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          .venv/bin/python -m publication_pipeline rollback-ssh
          | tee "$RUNNER_TEMP/helios-rollback.json"

      - name: Verify restored production release
        if: failure() && steps.rollback.outcome == 'success'
        env:
          HELIOS_BASE_URL: ${{ vars.HELIOS_BASE_URL }}
        run: |
          release_id="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["release_id"])' \
            "$RUNNER_TEMP/helios-rollback.json")"
          .venv/bin/python -m publication_pipeline healthcheck \
            --url "$HELIOS_BASE_URL" \
            --expected-text "deployment-marker:${release_id}:" \
            --attempts 5 \
            --delay-seconds 5 \
            | tee "$RUNNER_TEMP/helios-rollback-healthcheck.json"

      - name: Upload Helios measurement receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helios-measurement-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/helios-build.json
            ${{ runner.temp }}/helios-deploy.json
            ${{ runner.temp }}/helios-healthcheck.json
            ${{ runner.temp }}/helios-rollback.json
            ${{ runner.temp }}/helios-rollback-healthcheck.json
          if-no-files-found: warn
          retention-days: 30

  deploy-helios-preview:
    if: github.ref != 'refs/heads/main' && vars.HELIOS_ENABLED == 'true'
    needs: quality
    concurrency:
      group: helios-preview-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: helios-preview
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Prepare protected SSH files
        env:
          HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          HELIOS_KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .secrets
          install -m 600 /dev/null .secrets/helios_key
          install -m 600 /dev/null .secrets/known_hosts
          printf '%s\n' "$HELIOS_SSH_KEY" > .secrets/helios_key
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > .secrets/known_hosts

      - name: Resolve preview URL
        id: preview
        env:
          HELIOS_BASE_URL: ${{ vars.HELIOS_BASE_URL }}
        run: |
          slug="$(.venv/bin/python -m publication_pipeline branch-slug --branch "$GITHUB_REF_NAME")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "url=${HELIOS_BASE_URL%/}/previews/$slug/" >> "$GITHUB_OUTPUT"

      - name: Build for preview URL
        env:
          SITE_URL: ${{ steps.preview.outputs.url }}
        run: >-
          .venv/bin/python -m publication_pipeline build --site-dir site
          | tee "$RUNNER_TEMP/preview-build.json"

      - name: Deploy preview release
        env:
          HELIOS_HOST: ${{ vars.HELIOS_HOST }}
          HELIOS_USER: ${{ vars.HELIOS_USER }}
          HELIOS_PORT: ${{ vars.HELIOS_PORT }}
          HELIOS_DEPLOYMENT_ROOT: ${{ vars.HELIOS_DEPLOYMENT_ROOT }}
          HELIOS_PUBLIC_PATH: ${{ vars.HELIOS_PUBLIC_PATH }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          .venv/bin/python -m publication_pipeline preview-ssh
          --site-dir site
          --branch "$GITHUB_REF_NAME"
          | tee "$RUNNER_TEMP/preview-deploy.json"

      - name: Verify preview release
        run: >-
          .venv/bin/python -m publication_pipeline healthcheck
          --url "${{ steps.preview.outputs.url }}"
          --release-file site/release.json
          --attempts 5
          --delay-seconds 5
          | tee "$RUNNER_TEMP/preview-healthcheck.json"
