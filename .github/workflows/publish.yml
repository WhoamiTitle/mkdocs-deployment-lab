name: Publish

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.22"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare-targets:
    if: vars.HELIOS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve deployment targets
        id: targets
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
        run: python3 -m scripts.deployment_targets

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked

      - name: Run quality gates and strict build
        run: make check

  build-pages:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Build GitHub Pages artifact
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: >-
          .venv/bin/python -m publication_pipeline build --site-dir site
          | tee "$RUNNER_TEMP/pages-build.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

      - name: Upload Pages measurement receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-measurement-${{ github.run_id }}
          path: ${{ runner.temp }}/pages-build.json
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  build-helios:
    needs: [quality, prepare-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Build artifacts for every Helios URL
        env:
          DEPLOY_TARGETS: ${{ needs.prepare-targets.outputs.targets }}
        run: .venv/bin/python -m scripts.build_deployment_targets

      - name: Upload Helios artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helios-sites-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            site/targets/
          if-no-files-found: error
          retention-days: 7

  deploy-helios-production:
    if: github.ref == 'refs/heads/main' && vars.HELIOS_ENABLED == 'true'
    needs: [prepare-targets, build-helios]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: helios-production
    concurrency:
      group: helios-production-${{ matrix.target.id }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Prepare protected SSH files
        env:
          HELIOS_SSH_KEY: ${{ secrets[matrix.target.key_secret] }}
          HELIOS_KNOWN_HOSTS: ${{ secrets[matrix.target.known_hosts_secret] }}
        run: |
          test -n "$HELIOS_SSH_KEY" || { echo "Missing SSH key secret" >&2; exit 1; }
          test -n "$HELIOS_KNOWN_HOSTS" || { echo "Missing known_hosts secret" >&2; exit 1; }
          install -d -m 700 .secrets
          install -m 600 /dev/null .secrets/helios_key
          install -m 600 /dev/null .secrets/known_hosts
          printf '%s\n' "$HELIOS_SSH_KEY" > .secrets/helios_key
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > .secrets/known_hosts

      - name: Download prebuilt Helios artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helios-sites-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts

      - name: Select target artifact
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          mv "artifacts/$TARGET_ID" site
          cp site/build-receipt.json "$RUNNER_TEMP/helios-build.json"

      - name: Deploy production release
        id: deploy
        env:
          HELIOS_HOST: ${{ matrix.target.host }}
          HELIOS_USER: ${{ matrix.target.user }}
          HELIOS_PORT: ${{ matrix.target.port }}
          HELIOS_DEPLOYMENT_ROOT: ${{ matrix.target.deployment_root }}
          HELIOS_PUBLIC_PATH: ${{ matrix.target.public_path }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          .venv/bin/python -m publication_pipeline deploy-ssh --site-dir site
          | tee "$RUNNER_TEMP/helios-deploy.json"

      - name: Verify production release
        env:
          HELIOS_BASE_URL: ${{ matrix.target.base_url }}
        run: >-
          .venv/bin/python -m publication_pipeline healthcheck
          --url "$HELIOS_BASE_URL"
          --release-file site/release.json
          --attempts 5
          --delay-seconds 5
          | tee "$RUNNER_TEMP/helios-healthcheck.json"

      - name: Roll back after a failed production healthcheck
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          HELIOS_HOST: ${{ matrix.target.host }}
          HELIOS_USER: ${{ matrix.target.user }}
          HELIOS_PORT: ${{ matrix.target.port }}
          HELIOS_DEPLOYMENT_ROOT: ${{ matrix.target.deployment_root }}
          HELIOS_PUBLIC_PATH: ${{ matrix.target.public_path }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          .venv/bin/python -m publication_pipeline rollback-ssh
          | tee "$RUNNER_TEMP/helios-rollback.json"

      - name: Verify restored production release
        if: failure() && steps.rollback.outcome == 'success'
        env:
          HELIOS_BASE_URL: ${{ matrix.target.base_url }}
        run: |
          release_id="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["release_id"])' \
            "$RUNNER_TEMP/helios-rollback.json")"
          .venv/bin/python -m publication_pipeline healthcheck \
            --url "$HELIOS_BASE_URL" \
            --expected-text "deployment-marker:${release_id}:" \
            --attempts 5 \
            --delay-seconds 5 \
            | tee "$RUNNER_TEMP/helios-rollback-healthcheck.json"

      - name: Upload Helios measurement receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helios-measurement-${{ matrix.target.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/helios-build.json
            ${{ runner.temp }}/helios-deploy.json
            ${{ runner.temp }}/helios-healthcheck.json
            ${{ runner.temp }}/helios-rollback.json
            ${{ runner.temp }}/helios-rollback-healthcheck.json
          if-no-files-found: warn
          retention-days: 30

  deploy-helios-preview:
    if: github.ref != 'refs/heads/main' && vars.HELIOS_ENABLED == 'true'
    needs: [prepare-targets, build-helios]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-targets.outputs.targets) }}
    concurrency:
      group: helios-preview-${{ matrix.target.id }}-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: helios-preview
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Prepare protected SSH files
        env:
          HELIOS_SSH_KEY: ${{ secrets[matrix.target.key_secret] }}
          HELIOS_KNOWN_HOSTS: ${{ secrets[matrix.target.known_hosts_secret] }}
        run: |
          test -n "$HELIOS_SSH_KEY" || { echo "Missing SSH key secret" >&2; exit 1; }
          test -n "$HELIOS_KNOWN_HOSTS" || { echo "Missing known_hosts secret" >&2; exit 1; }
          install -d -m 700 .secrets
          install -m 600 /dev/null .secrets/helios_key
          install -m 600 /dev/null .secrets/known_hosts
          printf '%s\n' "$HELIOS_SSH_KEY" > .secrets/helios_key
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > .secrets/known_hosts

      - name: Resolve preview URL
        id: preview
        env:
          HELIOS_BASE_URL: ${{ matrix.target.base_url }}
        run: |
          slug="$(.venv/bin/python -m publication_pipeline branch-slug --branch "$GITHUB_REF_NAME")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "url=${HELIOS_BASE_URL%/}/previews/$slug/" >> "$GITHUB_OUTPUT"

      - name: Download prebuilt Helios artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helios-sites-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts

      - name: Select target artifact
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          mv "artifacts/$TARGET_ID" site
          cp site/build-receipt.json "$RUNNER_TEMP/helios-build.json"

      - name: Deploy preview release
        env:
          HELIOS_HOST: ${{ matrix.target.host }}
          HELIOS_USER: ${{ matrix.target.user }}
          HELIOS_PORT: ${{ matrix.target.port }}
          HELIOS_DEPLOYMENT_ROOT: ${{ matrix.target.deployment_root }}
          HELIOS_PUBLIC_PATH: ${{ matrix.target.public_path }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          .venv/bin/python -m publication_pipeline preview-ssh
          --site-dir site
          --branch "$GITHUB_REF_NAME"
          | tee "$RUNNER_TEMP/preview-deploy.json"

      - name: Verify preview release
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: >-
          .venv/bin/python -m publication_pipeline healthcheck
          --url "$PREVIEW_URL"
          --release-file site/release.json
          --attempts 5
          --delay-seconds 5
          | tee "$RUNNER_TEMP/preview-healthcheck.json"
