[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "publication-pipeline"
version = "0.1.0"
description = "Reproducible publication pipeline for the T4/P4 static-site assignment"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
  { name = "Vasiliy" },
]
dependencies = []

[project.scripts]
publication-pipeline = "publication_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.codespell]
skip = ".git,.venv,site,.local-deploy,docs/assets/vendor"
ignore-words-list = "crate,fo"
