name: Publish

on:
  push:
    branches: ["**", "!site-builds"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable tag to publish (empty means preview)
        required: false
        type: string

permissions:
  contents: read
env:
  UV_VERSION: "0.12.22"
concurrency:
  group: site-publication
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked

      - name: Run quality gates and strict build
        run: make check


  publish:
    needs: quality
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/site-operation.yml
    with:
      operation: ${{ (github.ref_type == 'tag' || inputs.version != '') && 'version' || 'preview' }}
      version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '' }}
      name: ${{ github.ref_name }}
    secrets: inherit
