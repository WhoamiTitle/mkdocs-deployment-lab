name: Clean Helios preview

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target ID (empty means all targets)
        required: false
        type: string
      branch:
        description: Exact branch name whose preview should be removed
        required: true
        type: string
  delete:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.22"

defaults:
  run:
    shell: bash

jobs:
  prepare-targets:
    if: vars.HELIOS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve deployment targets
        id: targets
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET_ID: ${{ inputs.target }}
        run: python3 -m scripts.deployment_targets

  cleanup-preview:
    needs: prepare-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-targets.outputs.targets) }}
    if: >-
      vars.HELIOS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch')
    concurrency:
      group: >-
        helios-preview-${{ matrix.target.id }}-${{ github.event_name == 'delete' && github.event.ref || inputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: helios-preview
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --no-dev

      - name: Resolve preview identity
        id: preview
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
          EVENT_NAME: ${{ github.event_name }}
          HELIOS_BASE_URL: ${{ matrix.target.base_url }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "delete" ]; then
            branch="$DELETED_BRANCH"
          else
            branch="$REQUESTED_BRANCH"
          fi
          test -n "$branch"
          slug="$(.venv/bin/python -m publication_pipeline branch-slug --branch "$branch")"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'slug=%s\n' "$slug" >> "$GITHUB_OUTPUT"
          printf 'url=%s/previews/%s/\n' "${HELIOS_BASE_URL%/}" "$slug" >> "$GITHUB_OUTPUT"

      - name: Prepare protected SSH files
        env:
          HELIOS_SSH_KEY: ${{ secrets[matrix.target.key_secret] }}
          HELIOS_KNOWN_HOSTS: ${{ secrets[matrix.target.known_hosts_secret] }}
        run: |
          test -n "$HELIOS_SSH_KEY" || { echo "Missing SSH key secret" >&2; exit 1; }
          test -n "$HELIOS_KNOWN_HOSTS" || { echo "Missing known_hosts secret" >&2; exit 1; }
          install -d -m 700 .secrets
          install -m 600 /dev/null .secrets/helios_key
          install -m 600 /dev/null .secrets/known_hosts
          printf '%s\n' "$HELIOS_SSH_KEY" > .secrets/helios_key
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > .secrets/known_hosts

      - name: Remove immutable preview releases
        env:
          PREVIEW_BRANCH: ${{ steps.preview.outputs.branch }}
          HELIOS_HOST: ${{ matrix.target.host }}
          HELIOS_USER: ${{ matrix.target.user }}
          HELIOS_PORT: ${{ matrix.target.port }}
          HELIOS_DEPLOYMENT_ROOT: ${{ matrix.target.deployment_root }}
          HELIOS_PUBLIC_PATH: ${{ matrix.target.public_path }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          .venv/bin/python -m publication_pipeline cleanup-preview-ssh
          --branch "$PREVIEW_BRANCH"
          --confirm-branch "$PREVIEW_BRANCH"
          | tee "$RUNNER_TEMP/preview-cleanup.json"

      - name: Verify preview is unavailable
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          status=000
          for attempt in 1 2 3 4 5; do
            status="$(curl --location --silent --show-error --output /dev/null \
              --write-out '%{http_code}' "${PREVIEW_URL}?cleanup_probe=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$status" = "404" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "404"

      - name: Upload cleanup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-cleanup-${{ matrix.target.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-cleanup.json
          if-no-files-found: error
          retention-days: 30
