name: Clean Helios preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Exact branch name whose preview should be removed
        required: true
        type: string
  delete:

permissions:
  contents: read

jobs:
  cleanup-preview:
    if: >-
      vars.HELIOS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: helios-preview
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --no-deps --editable .

      - name: Resolve preview identity
        id: preview
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
          EVENT_NAME: ${{ github.event_name }}
          HELIOS_BASE_URL: ${{ vars.HELIOS_BASE_URL }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "delete" ]; then
            branch="$DELETED_BRANCH"
          else
            branch="$REQUESTED_BRANCH"
          fi
          test -n "$branch"
          slug="$(python -m publication_pipeline branch-slug --branch "$branch")"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'slug=%s\n' "$slug" >> "$GITHUB_OUTPUT"
          printf 'url=%s/previews/%s/\n' "${HELIOS_BASE_URL%/}" "$slug" >> "$GITHUB_OUTPUT"

      - name: Prepare protected SSH files
        env:
          HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          HELIOS_KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .secrets
          install -m 600 /dev/null .secrets/helios_key
          install -m 600 /dev/null .secrets/known_hosts
          printf '%s\n' "$HELIOS_SSH_KEY" > .secrets/helios_key
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > .secrets/known_hosts

      - name: Remove immutable preview releases
        env:
          HELIOS_HOST: ${{ vars.HELIOS_HOST }}
          HELIOS_USER: ${{ vars.HELIOS_USER }}
          HELIOS_PORT: ${{ vars.HELIOS_PORT }}
          HELIOS_DEPLOYMENT_ROOT: ${{ vars.HELIOS_DEPLOYMENT_ROOT }}
          HELIOS_PUBLIC_PATH: ${{ vars.HELIOS_PUBLIC_PATH }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
        run: >-
          python -m publication_pipeline cleanup-preview-ssh
          --branch "${{ steps.preview.outputs.branch }}"
          --confirm-branch "${{ steps.preview.outputs.branch }}"
          | tee "$RUNNER_TEMP/preview-cleanup.json"

      - name: Verify preview is unavailable
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          status=000
          for attempt in 1 2 3 4 5; do
            status="$(curl --location --silent --show-error --output /dev/null \
              --write-out '%{http_code}' "${PREVIEW_URL}?cleanup_probe=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$status" = "404" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "404"

      - name: Upload cleanup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-cleanup.json
          if-no-files-found: error
          retention-days: 30
