name: Verify Helios resilience

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type mkdocs-deployment-lab-sandbox to run destructive sandbox checks
        required: true
        type: string

permissions:
  contents: read

jobs:
  resilience:
    if: >-
      vars.HELIOS_ENABLED == 'true' &&
      inputs.confirmation == 'mkdocs-deployment-lab-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: helios-preview
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --no-deps --editable .

      - name: Prepare protected SSH files
        env:
          HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          HELIOS_KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .secrets
          install -m 600 /dev/null .secrets/helios_key
          install -m 600 /dev/null .secrets/known_hosts
          printf '%s\n' "$HELIOS_SSH_KEY" > .secrets/helios_key
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > .secrets/known_hosts

      - name: Run destructive checks in sandbox
        env:
          ALLOW_DESTRUCTIVE_TEST_CLEANUP: "1"
          HELIOS_BASE_URL: ${{ vars.HELIOS_BASE_URL }}
          HELIOS_HOST: ${{ vars.HELIOS_HOST }}
          HELIOS_KNOWN_HOSTS_PATH: .secrets/known_hosts
          HELIOS_PORT: ${{ vars.HELIOS_PORT }}
          HELIOS_SSH_KEY_PATH: .secrets/helios_key
          HELIOS_USER: ${{ vars.HELIOS_USER }}
        run: |
          sandbox_url="${HELIOS_BASE_URL%/}-sandbox/"
          python -m scripts.verify_helios_resilience \
            --base-url "$sandbox_url" \
            --production-url "$HELIOS_BASE_URL" \
            --output "$RUNNER_TEMP/helios-resilience.json" \
            --cleanup

      - name: Upload resilience evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helios-resilience-${{ github.run_id }}
          path: ${{ runner.temp }}/helios-resilience.json
          if-no-files-found: error
          retention-days: 30
