name: Select latest version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Already published stable version to select as latest
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: site-publication
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/site-operation.yml
    with:
      operation: set-latest
      version: ${{ inputs.version }}
    secrets: inherit
